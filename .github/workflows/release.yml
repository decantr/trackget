name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: make test
      - run: make zip VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/TrackGet.zip build/TrackGet.zip.sha256
          --title "TrackGet $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
